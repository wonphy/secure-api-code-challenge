services:
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    env_file:
      - ./packages/gateway/.env
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:3001
      BACKEND_ALLOWED_HOSTS: backend
    networks:
      - public
      - private
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    env_file:
      - ./packages/backend/.env
    environment:
      PORT: 3001
    expose:
      - "3001"
    networks:
      - private
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  # The gateway needs external IdP/JWKS access as well as backend access.
  public:
  # The backend has no host port and no route beyond gateway-attached services.
  private:
    internal: true
