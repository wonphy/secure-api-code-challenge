name: Merge queue

on:
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep this job name aligned with pr.yml so one ruleset-required check is
  # reported for both pull requests and their prospective merged result.
  validate:
    # Required when GitHub merge queue is enabled: validates the queued merge SHA.
    uses: ./.github/workflows/validate.yml
    with:
      run_mtls_e2e: true
