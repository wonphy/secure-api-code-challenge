name: Validate

on:
  workflow_call:
    inputs:
      run_mtls_e2e:
        description: Run the Docker-based mTLS gateway-bypass integration check.
        required: false
        default: false
        type: boolean

# Validation needs only a read-only checkout; deployments live in separate workflows.
permissions:
  contents: read

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-node needs the pnpm executable to locate its cache directory.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static checks
        run: pnpm check
      - name: Run native test suite
        run: pnpm test
      - name: Run Jest integration tests
        run: pnpm test:integration
      - name: Validate Compose definitions
        run: |
          cp packages/gateway/.env.example packages/gateway/.env
          cp packages/backend/.env.example packages/backend/.env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.mtls.yaml config --quiet
      - name: Build service images
        run: |
          docker build --tag secure-entry-gateway:ci --file packages/gateway/Dockerfile .
          docker build --tag secure-entry-backend:ci --file packages/backend/Dockerfile .
      - name: Check production dependencies for critical findings
        # The documented, non-reachable high advisory remains visible to Dependabot/audit.
        run: pnpm audit --prod --audit-level=critical

  mtls-e2e:
    if: inputs.run_mtls_e2e
    needs: quality-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create local-only certificates
        run: sh scripts/setup-local-mtls.sh
      - name: Start the mTLS topology
        run: |
          printf '%s\n' 'NODE_ENV=development' 'DEV_GATEWAY_TOKEN=ci-local-token' > packages/gateway/.env
          cp packages/backend/.env.example packages/backend/.env
          docker compose -f compose.yaml -f compose.mtls.yaml up --build --detach
      - name: Wait for gateway readiness
        # The mTLS overlay deliberately has no HTTP backend health check.
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ready; then exit 0; fi
            sleep 1
          done
          docker compose -f compose.yaml -f compose.mtls.yaml logs --no-color
          exit 1
      - name: Verify gateway bypass attempts are rejected during the TLS handshake
        run: |
          sh scripts/bypass-gateway.sh
          sh scripts/bypass-gateway.sh ci-forged-user
      - name: Print service logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.mtls.yaml logs --no-color
      - name: Stop the mTLS topology
        if: always()
        run: docker compose -f compose.yaml -f compose.mtls.yaml down --volumes --remove-orphans
